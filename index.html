<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Route</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- NAV BAR -->
    <nav class="navbar px-4 py-3">
      <a class="navbar-brand-text" href="#" onclick="visaSida('hem')">
        <img src="logga.png" alt="Logotyp" height="40" />
      </a>

      <div id="navLinks" class="d-flex gap-3">
        <a href="#" class="nav-link-custom active" data-page="hem">
          <i class="bi bi-house-fill me-1"></i>Hem
        </a>
        <a href="#" class="nav-link-custom" data-page="statistik">
          <i class="bi bi-bar-chart-fill me-1"></i>Statistik
        </a>
        <a href="#" class="nav-link-custom" data-page="karta">
          <i class="bi bi-map-fill me-1"></i>Karta
        </a>
        <a href="#" class="nav-link-custom" data-page="om">
          <i class="bi bi-info-circle-fill me-1"></i>Om projektet
        </a>
      </div>
    </nav>

    <!-- STARTSIDA/HEMSIDA -->
    <div id="page-hem" class="page active">
      <div class="hero">
        <h1>Rubrik</h1>
        <p>Lite text att skriva i vår herosektion</p>
      </div>

      <!-- STAT BAR -->
      <div class="stats-bar d-flex justify-content-around">
        <div class="stat-item">
          <i class="bi bi-wind"></i>
          <div class="stat-number">-</div>
          <div class="stat-label">Utsläpp 2025</div>
        </div>
        <div class="stat-item">
          <i class="bi bi-thermometer-half"></i>
          <div class="stat-number">-</div>
          <div class="stat-label">Förändring sedan 2015</div>
        </div>
        <div class="stat-item">
          <i class="bi bi-building"></i>
          <div class="stat-number">-</div>
          <div class="stat-label">Rubrik</div>
        </div>
        <div class="stat-item">
          <i class="bi bi-globe"></i>
          <div class="stat-number">-</div>
          <div class="stat-label">Rubrik</div>
        </div>
      </div>
    </div>

    <!-- STATISTIK SIDA-->
    <div id="page-statistik" class="page">
      <canvas id="myChart"></canvas>
    </div>

    <!-- KARTA SIDA-->
    <div id="page-karta" class="page"></div>

    <!-- OM PROJEKTET SIDA-->
    <div id="page-om" class="page"></div>

    <!-- FOOTER-->
    <footer>
      <p>Green Route · GIK373 Projektarbete 2026 · Grupp 7</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
